name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-runtime:
    name: Build divaft_runtime + loader tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DDIVAFT_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build -j4

      - name: Smoke (loader tool runs)
        run: |
          ./build/divaft_load 2>&1 | grep -q usage && echo "loader tool OK"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: divaft-runtime
          path: build/divaft_load
