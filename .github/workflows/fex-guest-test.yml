name: FEX guest test

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "scripts/**"
      - ".github/workflows/fex-guest-test.yml"
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: "30.0.16248370"

jobs:
  host-hle-test:
    name: Host HLE regression (heap / wire, no FEX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Compile & run host HLE tests
        run: |
          set -e
          CXX="g++ -std=c++20 -O2 -I runtime/include"
          $CXX runtime/test_guest_heap.cpp runtime/guest_memory.cpp -o /tmp/th
          /tmp/th
          $CXX runtime/test_hle_wire.cpp runtime/hle_wire.cpp runtime/hle_kernel.cpp runtime/hle_libc.cpp runtime/guest_memory.cpp runtime/guest_bridge.cpp -o /tmp/tw -lpthread
          /tmp/tw runtime/data/contract.tsv
          echo "HOST_HLE_TEST_PASS"

  fex-guest-test:
    name: Build FEX + divaft guest_test, run under qemu-aarch64
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install NDK, cmake, ninja, qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qemu-user gcc-aarch64-linux-gnu
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Fetch FEX
        run: bash scripts/fetch-fex.sh

      - name: Build FEX + divaft guest_test
        run: bash scripts/configure-fex-android.sh

      - name: Static-link guest_test (for qemu user-mode)
        run: bash scripts/build-guest-static.sh

      - name: Run guest_test under qemu-aarch64
        run: |
          BIN=build/fex-android/Bin/fexcore-guest-harness-static
          qemu-aarch64 "$BIN" | tee /tmp/guest-test.log
          if grep -q GUEST_EXEC_PASS /tmp/guest-test.log; then
            echo "GUEST_EXEC_PASS confirmed (qemu-aarch64)"
          else
            echo "GUEST_EXEC_PASS not found" >&2
            exit 1
          fi

      - name: Upload guest_test binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: divaft-guest-test
          path: build/fex-android/Bin/fexcore-guest-harness-static
